groupName: validation-cpu-workers
replicas: 0
minReplicas: 0
maxReplicas: {{ .Values.validation.maxWorkerReplicas }}
rayStartParams:
  num-cpus: "1"
template:
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: ray-worker
        image: "{{ .Values.rayImage.repository }}:{{ .Values.rayImage.tag }}"
        imagePullPolicy: {{ .Values.rayImage.pullPolicy }}
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 1
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsUser: 1000
        {{- if .Values.executionScheduler.empaia.enabled }}
        env:
          - name: EMPAIA_GATEWAY_FACTORY
            value: {{ .Values.executionScheduler.empaia.gatewayFactory | quote }}
          - name: EMPAIA_WORKSPACE_ROOT
            value: {{ .Values.executionScheduler.empaia.workspaceRoot | quote }}
        {{- end }}
        volumeMounts:
          - name: shared
            mountPath: /mnt/validation
          {{- if .Values.executionScheduler.empaia.enabled }}
          - name: empaia-workspace
            mountPath: {{ .Values.executionScheduler.empaia.workspaceRoot | quote }}
          {{- end }}
    volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: model-service-validation-shared
      {{- if .Values.executionScheduler.empaia.enabled }}
      - name: empaia-workspace
        persistentVolumeClaim:
          claimName: {{ .Values.executionScheduler.empaia.workspaceClaim | quote }}
      {{- end }}
