groupName: full-wsi-gpu-workers
replicas: 1
minReplicas: 1
maxReplicas: 1
rayStartParams:
  num-cpus: "8"
  num-gpus: "1"
  object-store-memory: "1073741824"
template:
  spec:
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: ray-worker
        image: "{{ .Values.fullWsi.gpuImage.repository }}:{{ .Values.fullWsi.gpuImage.tag }}"
        imagePullPolicy: {{ .Values.fullWsi.gpuImage.pullPolicy }}
        resources:
          requests:
            cpu: 8
            memory: 24Gi
            nvidia.com/mig-2g.20gb: 1
          limits:
            cpu: 8
            memory: 24Gi
            nvidia.com/mig-2g.20gb: 1
        env:
          - name: HTTPS_PROXY
            value: http://proxy.muni.cz:3128
          - name: HTTP_PROXY
            value: http://proxy.muni.cz:3128
          - name: NO_PROXY
            value: .svc.cluster.local,.svc,10.0.0.0/8,147.251.0.0/16,127.0.0.1
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.fullWsi.mlflowCredentialsSecret }}
                key: username
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.fullWsi.mlflowCredentialsSecret }}
                key: token
          - name: TMPDIR
            value: /mnt/scratch
          - name: VIPS_DISC_THRESHOLD
            value: "268435456"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsUser: 1000
        volumeMounts:
          - name: inputs
            mountPath: /mnt/validation
          - name: outputs
            mountPath: /mnt/validation/outputs
          - name: outputs
            mountPath: /mnt/validation/.workflow-attempts
          - name: scratch
            mountPath: /mnt/scratch
          - name: trt-cache
            mountPath: /mnt/cache
    volumes:
      - name: inputs
        persistentVolumeClaim:
          claimName: {{ .Values.fullWsi.inputClaim }}
      - name: outputs
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-outputs
      - name: scratch
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-scratch
      - name: trt-cache
        persistentVolumeClaim:
          claimName: {{ .Values.fullWsi.tensorRtCacheClaim }}
