groupName: cpu-workers
replicas: 0
minReplicas: 0
maxReplicas: 1
rayStartParams:
  num-cpus: "4"
  object-store-memory: "1073741824"
template:
  spec:
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: ray-worker
        image: "{{ .Values.rayImage.repository }}:{{ .Values.rayImage.tag }}"
        imagePullPolicy: {{ .Values.rayImage.pullPolicy }}
        resources:
          requests:
            cpu: 4
            memory: 8Gi
          limits:
            cpu: 4
            memory: 10Gi
        env:
          {{- include "peknik.proxyEnv" . | nindent 10 }}
          - name: TMPDIR
            value: /mnt/scratch
          - name: VIPS_DISC_THRESHOLD
            value: "268435456"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsUser: 1000
        volumeMounts:
          - name: shared
            mountPath: /mnt/shared
          - name: scratch
            mountPath: /mnt/scratch
    volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-outputs
      - name: scratch
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-scratch
