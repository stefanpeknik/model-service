workers:
  - validation-cpu-workers

applications:
  - validation-prostate-heatmap

validation:
  maxWorkerReplicas: 1
  appService:
    enabled: true
    image:
      repository: cerit.io/stefanpeknik/model-service-appservice-validation
      tag: validation-20260923-3
      pullPolicy: Always

rayImage:
  repository: cerit.io/stefanpeknik/model-service-ray-validation
  tag: validation-20260923-2
  pullPolicy: Always

executionScheduler:
  enabled: true
  replicas: 1
  image:
    repository: cerit.io/stefanpeknik/model-service-scheduler
    tag: empaia-tile-20260922-1
    pullPolicy: Always
  database:
    existingSecret: model-service-validation-db
    urlKey: database-url
  encryption:
    existingSecret: model-service-validation-db
    keyKey: provider-context-key
  sharedStorage:
    existingClaim: model-service-validation-shared
    mountPath: /mnt/validation
  empaia:
    enabled: true
    gatewayFactory: integrations.empaia.http_gateway:create_http_gateway
    workspaceRoot: /mnt/model-service-executions
    workspaceClaim: model-service-validation-shared
  leaseSeconds: 30
  workerPollSeconds: 0.5
  initialBackoffSeconds: 2
  maximumBackoffSeconds: 30
  defaultDeadlineSeconds: 600
  maximumDeadlineSeconds: 600
