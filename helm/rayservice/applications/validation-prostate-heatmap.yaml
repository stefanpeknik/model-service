- name: prostate-heatmap
  import_path: validation.serve:app
  route_prefix: /workflows/prostate-heatmap
  deployments:
    - name: ValidationProstateHeatmapApplication
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1
        target_ongoing_requests: 1
      ray_actor_options:
        num_cpus: 1
