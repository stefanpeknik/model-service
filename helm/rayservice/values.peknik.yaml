# peknik-ns test deployment. One CPU worker hosts builders and the constant
# model; one MIG GPU worker (scales to zero) hosts GPU models.
models:
  - peknik/prostate-classifier-1
  - peknik/constant-classifier

builders:
  heatmap:
    deployment:
      max_ongoing_requests: 1
      max_queued_requests: 2
      backpressure_config:
        status_code: 429
        retry_after_s: 5
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1
        target_ongoing_requests: 1
        downscale_delay_s: 120
      ray_actor_options:
        num_cpus: 2
        memory: 4294967296
    userConfig:
      num_threads: 2
      max_concurrent_tasks: 32
  tile-embeddings:
    deployment:
      max_ongoing_requests: 1
      max_queued_requests: 2
      backpressure_config:
        status_code: 429
        retry_after_s: 5
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1
        target_ongoing_requests: 1
        downscale_delay_s: 120
      ray_actor_options:
        num_cpus: 1
        memory: 2147483648
    userConfig:
      num_threads: 1
      max_concurrent_tasks: 32

sharedStorageRoots: [/mnt/shared]

workers:
  - peknik-cpu-workers
  - peknik-gpu-workers

rayImage:
  repository: cerit.io/stefanpeknik/model-service-ray
  tag: ""
  pullPolicy: IfNotPresent

storage:
  storageClassName: nfs-csi
  outputSize: 32Gi
  scratchSize: 32Gi

validation:
  appService:
    enabled: false

executionScheduler:
  enabled: true
  replicas: 1
  image:
    repository: cerit.io/stefanpeknik/model-service-scheduler
    tag: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: model-service-validation-db
    urlKey: database-url
  encryption:
    existingSecret: model-service-validation-db
    keyKey: provider-context-key
  sharedStorage:
    existingClaim: model-service-validation-full-wsi-outputs
    mountPath: /mnt/shared
  inferenceTimeoutSeconds: 900
  defaultDeadlineSeconds: 21600
  maximumDeadlineSeconds: 86400
  processingAttempts: 2
  maxConcurrentExecutions: 4
  empaia:
    enabled: false
