[project]
name = "model-service"
version = "0.1.0"
authors = [
    { name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" },
    { name = "Jiří Štípek", email = "567776@mail.muni.cz" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "lz4>=4.4.5",
    "mlflow<3.0",
    "onnxruntime>=1.23.2",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "ratiopath>=1.0.3",
    "ray[serve]>=2.58.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["mypy>=1.18.2", "ruff>=0.14.6"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.6.0", "pymdown-extensions>=10.0"]
