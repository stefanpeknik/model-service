[project]
name = "model-service"
version = "0.1.0"
authors = [
    { name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" },
    { name = "Jiří Štípek", email = "567776@mail.muni.cz" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# What every process shares (contracts/). Each process adds its own extra.
# Dockerfile.api installs `api` from uv.lock; the Ray images still list their
# packages by hand (with GPU builds of torch and ONNX Runtime), so `builders`
# and `inference` describe them for development and tests.
dependencies = [
    "numpy>=1.26.4",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
# The API process: HTTP, the scheduler's database, model catalog, EMPAIA.
api = [
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0,<5",
    "pydantic-settings>=2.10.0,<3",
    "pyjwt>=2.15.1,<3",
    "psycopg[binary]>=3.2.0",
    "rationai-empaia>=0.1.2",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn>=0.30.0",
    "yoyo-migrations>=9.0.0,<10",
]
# Builder replicas on Ray Serve, with the providers' input access.
builders = [
    "fastapi>=0.115.0",
    "h5py>=3.11,<4",
    "httpx>=0.27.0",
    "openslide-python>=1.4.0",
    "pydantic-settings>=2.10.0,<3",
    "pyvips>=3.0.0,<4",
    "rationai-empaia>=0.1.2",
    "ratiopath>=1.4.0",
    "ray[serve]>=2.58.0",
]
# Model replicas on Ray Serve.
inference = [
    "fastapi>=0.115.0",
    "lz4>=4.4.5",
    "mlflow<3.0",
    "onnxruntime>=1.23.2",
    "pillow>=11.3.0",
    "ray[serve]>=2.58.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "openslide-bin>=4.0.0,<5",
    "pyvips[binary]>=3.0.0,<4",
    "pyyaml>=6.0.2",
    "ruff>=0.14.6",
]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.6.0", "pymdown-extensions>=10.0"]

[tool.uv.sources]
rationai-empaia = { path = "../empaia", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]
