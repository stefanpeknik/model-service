[project]
name = "model-service"
version = "0.1.0"
authors = [
    { name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" },
    { name = "Jiří Štípek", email = "567776@mail.muni.cz" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# What the API process needs: HTTP, the scheduler's database, and the EMPAIA SDK.
dependencies = [
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0,<3",
    "pyjwt>=2.15.1,<3",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.0",
    "rationai-empaia>=0.1.2",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn>=0.30.0",
    "yoyo-migrations>=9.0.0,<10",
]

[project.optional-dependencies]
# What Ray Serve needs on top: builder replicas and model implementations.
serve = [
    "h5py>=3.11,<4",
    "lz4>=4.4.5",
    "mlflow<3.0",
    "onnxruntime>=1.23.2",
    "pillow>=11.3.0",
    "ratiopath>=1.0.3",
    "ray[serve]>=2.58.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "openslide-bin>=4.0.0,<5",
    "pyvips[binary]>=3.0.0,<4",
    "ruff>=0.14.6",
]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.6.0", "pymdown-extensions>=10.0"]

[tool.uv.sources]
rationai-empaia = { git = "ssh://git@gitlab.ics.muni.cz/524810/empaia.git", branch = "feat/job-configuration-client-on-mr10" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]
