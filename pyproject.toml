[project]
name = "model-service"
version = "0.1.0"
authors = [
    { name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" },
    { name = "Jiří Štípek", email = "567776@mail.muni.cz" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# What every process shares (contracts/). Each process adds its own extra.
dependencies = [
    "numpy>=1.26.4",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
# The API process: HTTP, the scheduler's database, model catalog, EMPAIA.
api = [
    "asgi-correlation-id>=4.3,<5",
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.10.0,<3",
    "pyjwt>=2.15.1,<3",
    "psycopg[binary]>=3.2.0",
    "python-json-logger>=3.2,<5",
    "rationai-empaia>=0.1.2",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn>=0.30.0",
    "yoyo-migrations>=9.0.0,<10",
]
# Builder replicas on Ray Serve, with the providers' input access.
builders = [
    "fastapi>=0.115.0",
    "h5py>=3.11,<4",
    "httpx>=0.27.0",
    "openslide-bin>=4.0.0,<5",
    "openslide-python>=1.4.0",
    "pydantic-settings>=2.10.0,<3",
    "python-json-logger>=3.2,<5",
    "pyvips[binary]>=3.0.0,<4",
    "rationai-empaia>=0.1.2",
    "ratiopath>=1.4.0",
    "ray[serve]>=2.58.0",
]
# Model replicas on Ray Serve.
inference = [
    "fastapi>=0.115.0",
    "lz4>=4.4.5",
    "mlflow<3.0",
    "pillow>=11.3.0",
    "ray[serve]>=2.58.0",
    "timm>=1.0,<2",
    "torch==2.8.0",
    "torchvision==0.23.0",
]
# Exactly one of these: both ONNX Runtime packages install the same module,
# and `cpu` takes torch's CPU build, `gpu` its CUDA build.
cpu = ["onnxruntime==1.23.2", "torch==2.8.0", "torchvision==0.23.0"]
gpu = [
    "onnxruntime-gpu==1.23.2",
    "tensorrt-cu12-libs==10.9.0.34",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pyyaml>=6.0.2",
    "ruff>=0.14.6",
]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.6.0", "pymdown-extensions>=10.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
# The SDK's `models` submodule points at a GitHub repository we cannot read;
# the same commit is on GitLab. Lock, sync and image builds rewrite its URL:
#   GIT_CONFIG_COUNT=1
#   GIT_CONFIG_KEY_0=url.git@gitlab.ics.muni.cz:rationai/digital-pathology/production/services/models.git.insteadOf
#   GIT_CONFIG_VALUE_0=https://github.com/AigoPath/EMPAIA-Models.git
rationai-empaia = { git = "ssh://git@gitlab.ics.muni.cz/524810/empaia.git", rev = "94de5d033685aaa26157174b148cbe46388324e7" }
# PyPI only has a download stub for this package.
tensorrt-cu12-libs = { index = "nvidia" }
# PyPI's Linux torch is the CUDA build; the CPU one is a fraction of its size.
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]
