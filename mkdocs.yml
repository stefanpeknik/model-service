site_name: Model Service Documentation
site_description: Model deployment infrastructure for RationAI using Ray Serve on Kubernetes
repo_url: https://github.com/RationAI/model-service
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Documentation map: README.md
  - Workflow operations:
      - Durable execution: operations/durable-workflow-execution.md
      - Full-WSI deployment: operations/full-wsi-deployment.md
      - Full-WSI validation, 2026-10-04: operations/full-wsi-validation-postmortem-2026-10-04.md
      - Local corrections, 2026-10-05: reviews/checkpoint-fixes-2026-10-05.md
      - Final validation, 2026-10-06: operations/final-standalone-validation-2026-10-06.md
  - Get Started:
      - Quick Start: get-started/quick-start.md
      - Installation: https://docs.ray.io/en/latest/cluster/kubernetes/getting-started/kuberay-operator-installation.html
      - First Deployment: https://docs.ray.io/en/latest/serve/production-guide/kubernetes.html
  - Guides:
      - Deployment Guide: guides/deployment-guide.md
      - Adding New Models: guides/adding-models.md
      - Configuration Reference: guides/configuration-reference.md
      - Optimization Guide: guides/optimization-guide.md
      - Troubleshooting: guides/troubleshooting.md
  - Architecture:
      - Overview: architecture/overview.md
      - Workflow execution proposal: architecture/workflow-execution-proposal.md
      - Workflow execution interfaces: architecture/execution-interfaces.md
      - Superseded EMPAIA prototype: architecture/empaia-control-plane.md
      - Request Lifecycle: architecture/request-lifecycle.md
      - Batching: architecture/batching.md
      - Queues and Backpressure: architecture/queues-and-backpressure.md
  - Available Models: available-models.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
