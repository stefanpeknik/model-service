site_name: Model Service Documentation
site_description: RationAI's served models and whole-slide analyses on Ray Serve
repo_url: https://github.com/RationAI/model-service
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Documentation map: README.md
  - Guides:
      - Add a model: guides/add-a-model.md
      - Add an analysis: guides/add-an-analysis.md
      - Write a component: guides/write-a-component.md
      - Raw inference: available-models.md
  - Reference:
      - Components: reference/components.md
      - Served models: reference/served-models.md
      - Analyses: reference/analyses.md
      - Data formats: reference/formats.md
      - Glossary: glossary.md
  - Architecture:
      - How it is put together: architecture/core.md
      - Specification: spec-components.md
      - How the chart deploys the catalog: architecture/deployment.md
      - EMPAIA integration: architecture/empaia.md
      - Module graph: architecture/module-graph.md
      - Scheduler outside Ray Serve: adr/0001-run-scheduler-outside-ray-serve.md
      - Ray layer overview: architecture/overview.md
      - Request lifecycle: architecture/request-lifecycle.md
      - Batching: architecture/batching.md
      - Queues and backpressure: architecture/queues-and-backpressure.md
  - Operations:
      - rationai-infra-test-ns deployment: operations/rationai-test-ns.md
      - Golden references, 2026-11-22: operations/golden-references-2026-11-22.md
      - Core acceptance, 2026-10-14: operations/core-acceptance-2026-10-14.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
