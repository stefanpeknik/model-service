# yaml-language-server: $schema=../.schemas/served-models.schema.json
# Virchow2 (Paige), a ViT-H/14 tile encoder with 4 register tokens. Per 224 px
# tile at 0.5 mpp (20x, the resolution it was trained at): the class token and
# the mean of the patch tokens, 1280 values each.
# The revision is the `main` commit the golden references were recorded with.
weights: {use: huggingface, repo: paige-ai/Virchow2, revision: 3158645804b69e3f3bc4439d4116edddf0840a72, files: [config.json, model.safetensors]}
runtime: {use: timm, num_classes: 0, mlp_layer: swiglu_packed, act_layer: silu, autocast: fp16, transform: pretrained}
post: [{use: cls_mean_pool, registers: 4}]
input: {tile_size: 224, mpp: 0.5}
output: {kind: embedding, summaries: [global, local_mean]}
batching: {max_size: 512, wait_s: 0.1}
resources: {gpus: 1, cpus: 4, memory_gib: 8}
