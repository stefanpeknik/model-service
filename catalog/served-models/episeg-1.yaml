# yaml-language-server: $schema=../.schemas/served-models.schema.json
# EPISeg: an epithelium score in [0, 1] per pixel of a 1024 px tile at 0.468 mpp.
# The ONNX graph takes uint8 RGB tiles (N, 3, 1024, 1024) and normalises inside.
loader: {use: mlflow, uri: "mlflow-artifacts:/10/39f821ed5b964c71a603cc6db196f9fd/artifacts/checkpoints/epoch=19-step=32020/model.onnx/model.onnx"}
# The scores are cast from float32 to float16, as the original class did. That
# class also ran its session on ONNX Runtime's defaults by passing its options
# under a keyword ONNX Runtime ignores; this file applies them.
runtime:
  use: onnx
  tensorrt: true
  workspace_gib: 6
  optimization_level: 3
  output_dtype: float16
input: {tile_size: 1024, mpp: 0.468}
output: {kind: scores, channels: 1, size: 1024, dtype: float16, range: [0, 1]}
batching: {max_size: 8, wait_s: 0.1}
resources: {gpus: 1, cpus: 4, memory_gib: 12}
