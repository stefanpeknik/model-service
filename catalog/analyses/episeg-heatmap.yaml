# Today's heatmap builder on episeg-1: the builder's defaults, tiles at the
# model's 1024 px and 0.468 µm/px, each tile's 1024 x 1024 score map averaged
# into the grid, an optional region of interest.
summary: Scores each pixel of a slide's tissue for epithelium into a heatmap.
source: {use: slide_tiles, stride_fraction: 0.5, skip_background: true, min_tissue_fraction: 0.0}
steps:
  - {model: episeg-1}
sinks:
  - {use: score_grid, output: heatmap}
