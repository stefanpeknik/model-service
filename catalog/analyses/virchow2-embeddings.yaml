# yaml-language-server: $schema=../.schemas/analyses.schema.json
# Today's tile-embeddings builder on virchow2: the builder's defaults, tiles
# at the model's 224 px and 0.5 µm/px side by side, an optional region of
# interest. Each row holds both summaries, global and local_mean.
summary: Embeds each tissue tile of a slide with Virchow2 into an HDF5 table.
source: {use: slide_tiles, stride_fraction: 1.0, skip_background: true, min_tissue_fraction: 0.0}
steps:
  - {model: virchow2}
sinks:
  - {use: embedding_table, output: embeddings}
