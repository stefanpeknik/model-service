{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control-plane
  namespace: {{ .Release.Namespace | default "rationai-jobs-ns" }}
  labels:
    app.kubernetes.io/name: model-service-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-service-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
