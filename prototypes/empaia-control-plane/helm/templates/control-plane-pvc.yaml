{{- if and .Values.controlPlane.enabled (not .Values.controlPlane.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-control-plane
  namespace: {{ .Release.Namespace | default "rationai-jobs-ns" }}
  labels:
    app.kubernetes.io/name: model-service-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.controlPlane.persistence.size }}
  {{- with .Values.controlPlane.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
