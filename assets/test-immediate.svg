<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1388 1200" role="img" aria-labelledby="title desc">
<title id="title">Immediate workflow · one HTTP request waits for the artifact reference</title><desc id="desc">Read downward. Each row names the function or operation and the transport. Actor lanes identify separate processes, even when they share a container. Dashed arrows are returns. Polling and lease renewal can overlap computation.</desc>
<style>
  text { font-family: system-ui, sans-serif; fill: #26332f; }
  .title { font-size: 25px; font-weight: 600; }
  .label { font-size: 17px; }
  .detail { font-size: 14px; fill: #5d6c64; }
  .lane-title { font-size: 17px; font-weight: 600; }
  .kind { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .box { fill: #faf8f3; stroke: #ccd5cb; stroke-width: 1.5; }
  .group { fill: #f3f1e9; stroke: #839589; stroke-width: 1.5; stroke-dasharray: 7 5; }
  .actor { fill: #fff; stroke: #63518f; stroke-width: 1.5; }
  .lifeline { stroke: #ccd5cb; stroke-dasharray: 4 5; }
  .row { stroke: #e8ece4; }
  .edge { fill: none; stroke-width: 2; }
  .returning { stroke-dasharray: 7 5; }
  .local { stroke: #46534b; } .kind-local { fill: #46534b; }
  .http { stroke: #17634d; } .kind-http { fill: #17634d; }
  .ray { stroke: #63518f; } .kind-ray { fill: #63518f; }
  .sql { stroke: #996122; } .kind-sql { fill: #996122; }
  .files { stroke: #346c8a; } .kind-files { fill: #346c8a; }
</style><defs><marker id="local" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#46534b"/></marker><marker id="http" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#17634d"/></marker><marker id="ray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#63518f"/></marker><marker id="sql" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#996122"/></marker><marker id="files" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#346c8a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="18" y="34" class="title" text-anchor="start">Immediate workflow · one HTTP request waits for the artifact reference</text><text x="18" y="60" class="detail" text-anchor="start">Read downward · dashed arrows return · LOCAL stays in one process · RAY crosses actor processes</text><rect x="381" y="82" width="150" height="61" rx="6" class="box"/><text x="456" y="106" class="lane-title" text-anchor="middle">Test client</text><text x="456" y="129" class="detail" text-anchor="middle">local Python</text><path d="M 456 145 V 1124" class="lifeline"/><rect x="549" y="82" width="150" height="61" rx="6" class="box"/><text x="624" y="106" class="lane-title" text-anchor="middle">API process</text><text x="624" y="129" class="detail" text-anchor="middle">scheduler container</text><path d="M 624 145 V 1124" class="lifeline"/><rect x="717" y="82" width="150" height="61" rx="6" class="box"/><text x="792" y="106" class="lane-title" text-anchor="middle">Serve proxy</text><text x="792" y="129" class="detail" text-anchor="middle">Ray entry point</text><path d="M 792 145 V 1124" class="lifeline"/><rect x="885" y="82" width="150" height="61" rx="6" class="box"/><text x="960" y="106" class="lane-title" text-anchor="middle">Workflow actor</text><text x="960" y="129" class="detail" text-anchor="middle">GPU worker container</text><path d="M 960 145 V 1124" class="lifeline"/><rect x="1053" y="82" width="150" height="61" rx="6" class="box"/><text x="1128" y="106" class="lane-title" text-anchor="middle">Classifier actor</text><text x="1128" y="129" class="detail" text-anchor="middle">same worker container</text><path d="M 1128 145 V 1124" class="lifeline"/><rect x="1221" y="82" width="150" height="61" rx="6" class="box"/><text x="1296" y="106" class="lane-title" text-anchor="middle">Mounted files</text><text x="1296" y="129" class="detail" text-anchor="middle">input/output PVCs</text><path d="M 1296 145 V 1124" class="lifeline"/><path d="M 18 205 H 1370" class="row"/><text x="18" y="177" class="label" text-anchor="start">1. Build typed request and deadline</text><text x="18" y="197" class="detail" text-anchor="start">SDK workflows.run → _run_body</text><path d="M 456 168 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="500" y="182" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 259 H 1370" class="row"/><text x="18" y="231" class="label" text-anchor="start">2. POST public /v1/.../run</text><text x="18" y="251" class="detail" text-anchor="start">JSON through loopback port-forward :18080 → :8080</text><path d="M 456 234 L 624 234" class="edge http" marker-end="url(#http)"/><text x="540" y="224" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 313 H 1370" class="row"/><text x="18" y="285" class="label" text-anchor="start">3. Validate and await dispatch</text><text x="18" y="305" class="detail" text-anchor="start">api.run_workflow → synchronous.run → dispatch.run</text><path d="M 624 276 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="668" y="290" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 367 H 1370" class="row"/><text x="18" y="339" class="label" text-anchor="start">4. POST /workflows/prostate-heatmap/</text><text x="18" y="359" class="detail" text-anchor="start">HTTPWorkflowDispatch → native serve-svc :8000</text><path d="M 624 342 L 792 342" class="edge http" marker-end="url(#http)"/><text x="708" y="332" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 421 H 1370" class="row"/><text x="18" y="393" class="label" text-anchor="start">5. Route to the workflow replica</text><text x="18" y="413" class="detail" text-anchor="start">Serve internal dispatch → ProstateHeatmapApplication.run</text><path d="M 792 396 L 960 396" class="edge ray" marker-end="url(#ray)"/><text x="876" y="386" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 475 H 1370" class="row"/><text x="18" y="447" class="label" text-anchor="start">6. Validate, create access, run workflow</text><text x="18" y="467" class="detail" text-anchor="start">run_workflow_http → WorkflowApplication.run</text><path d="M 960 438 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="1004" y="452" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 529 H 1370" class="row"/><text x="18" y="501" class="label" text-anchor="start">7. Resolve slide, ROI and output paths</text><text x="18" y="521" class="detail" text-anchor="start">SharedStorageAccess → ProstateHeatmapWorkflow.run</text><path d="M 960 504 L 1296 504" class="edge files" marker-end="url(#files)"/><text x="1128" y="494" class="kind kind-files" text-anchor="middle">FILES</text><path d="M 18 583 H 1370" class="row"/><text x="18" y="555" class="label" text-anchor="start">8. Fetch model tile configuration</text><text x="18" y="575" class="detail" text-anchor="start">RayHeatmapPredictor → get_config.remote</text><path d="M 960 558 L 1128 558" class="edge ray" marker-end="url(#ray)"/><text x="1044" y="548" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 637 H 1370" class="row"/><text x="18" y="609" class="label" text-anchor="start">9. Select level and enumerate tiles</text><text x="18" y="629" class="detail" text-anchor="start">SlideHeatmapProcessor.build → grid_tiles</text><path d="M 960 600 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="1004" y="614" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 691 H 1370" class="row"/><text x="18" y="663" class="label" text-anchor="start">10. Read mask windows and slide tiles</text><text x="18" y="683" class="detail" text-anchor="start">ThreadPoolExecutor → fetch_tissue_tile → OpenSlide</text><path d="M 960 666 L 1296 666" class="edge files" marker-end="url(#files)"/><text x="1128" y="656" class="kind kind-files" text-anchor="middle">FILES</text><path d="M 18 745 H 1370" class="row"/><text x="18" y="717" class="label" text-anchor="start">11. Predict selected tile arrays</text><text x="18" y="737" class="detail" text-anchor="start">RayHeatmapPredictor.predict → predict.remote</text><path d="M 960 720 L 1128 720" class="edge ray" marker-end="url(#ray)"/><text x="1044" y="710" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 799 H 1370" class="row"/><text x="18" y="771" class="label" text-anchor="start">12. Batch and execute cached ONNX model</text><text x="18" y="791" class="detail" text-anchor="start">serve.batch → BinaryClassifier.predict → session.run → GPU</text><path d="M 1128 762 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="1172" y="776" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 853 H 1370" class="row"/><text x="18" y="825" class="label" text-anchor="start">13. Return tile scores and reconstruct</text><text x="18" y="845" class="detail" text-anchor="start">MaskBuilder.update_batch / finalize; crop padded extent</text><path d="M 1128 828 L 960 828" class="edge ray returning" marker-end="url(#ray)"/><text x="1044" y="818" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 907 H 1370" class="row"/><text x="18" y="879" class="label" text-anchor="start">14. Write and atomically complete TIFF</text><text x="18" y="899" class="detail" text-anchor="start">pyvips.tiffsave → os.replace sibling temporary file</text><path d="M 960 882 L 1296 882" class="edge files" marker-end="url(#files)"/><text x="1128" y="872" class="kind kind-files" text-anchor="middle">FILES</text><path d="M 18 961 H 1370" class="row"/><text x="18" y="933" class="label" text-anchor="start">15. Check artifact and close access</text><text x="18" y="953" class="detail" text-anchor="start">WorkflowApplication._validate_result → close_resource</text><path d="M 960 924 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="1004" y="938" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 1015 H 1370" class="row"/><text x="18" y="987" class="label" text-anchor="start">16. Return named WorkflowResult</text><text x="18" y="1007" class="detail" text-anchor="start">heatmap = SharedArtifact(path, media_type)</text><path d="M 960 990 L 792 990" class="edge ray returning" marker-end="url(#ray)"/><text x="876" y="980" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 1069 H 1370" class="row"/><text x="18" y="1041" class="label" text-anchor="start">17. Return internal HTTP result</text><text x="18" y="1061" class="detail" text-anchor="start">dispatch validates and decodes the result envelope</text><path d="M 792 1044 L 624 1044" class="edge http returning" marker-end="url(#http)"/><text x="708" y="1034" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 1123 H 1370" class="row"/><text x="18" y="1095" class="label" text-anchor="start">18. Return public HTTP 200 JSON</text><text x="18" y="1115" class="detail" text-anchor="start">SDK decodes WorkflowResult; file bytes stay on PVC</text><path d="M 624 1098 L 456 1098" class="edge http returning" marker-end="url(#http)"/><text x="540" y="1088" class="kind kind-http" text-anchor="middle">HTTP</text><text x="18" y="1158" class="detail" text-anchor="start">Tile read/predict/reconstruct operations repeat and overlap; shown once for readability. get_config returns before tiling starts.</text><text x="18" y="1182" class="detail" text-anchor="start">The public request stays open through completion. This computation creates no execution row, claim, lease or provider-finish work.</text></svg>
