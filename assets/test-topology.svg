<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">What ran where in the final standalone validation</title><desc id="desc">Local test client reaches scheduler over a Kubernetes port-forward. Scheduler talks SQL to external PostgreSQL and HTTP to native Ray Serve. Head provides Ray control and entry. Workflow and classifier are separate actors in the GPU worker container. Shared PVCs carry images and artifacts; PostgreSQL has its own data PVC.</desc>
<style>
  text { font-family: system-ui, sans-serif; fill: #26332f; }
  .title { font-size: 25px; font-weight: 600; }
  .label { font-size: 17px; }
  .detail { font-size: 14px; fill: #5d6c64; }
  .lane-title { font-size: 17px; font-weight: 600; }
  .kind { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .box { fill: #faf8f3; stroke: #ccd5cb; stroke-width: 1.5; }
  .group { fill: #f3f1e9; stroke: #839589; stroke-width: 1.5; stroke-dasharray: 7 5; }
  .actor { fill: #fff; stroke: #63518f; stroke-width: 1.5; }
  .lifeline { stroke: #ccd5cb; stroke-dasharray: 4 5; }
  .row { stroke: #e8ece4; }
  .edge { fill: none; stroke-width: 2; }
  .returning { stroke-dasharray: 7 5; }
  .local { stroke: #46534b; } .kind-local { fill: #46534b; }
  .http { stroke: #17634d; } .kind-http { fill: #17634d; }
  .ray { stroke: #63518f; } .kind-ray { fill: #63518f; }
  .sql { stroke: #996122; } .kind-sql { fill: #996122; }
  .files { stroke: #346c8a; } .kind-files { fill: #346c8a; }
</style><defs><marker id="local" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#46534b"/></marker><marker id="http" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#17634d"/></marker><marker id="ray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#63518f"/></marker><marker id="sql" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#996122"/></marker><marker id="files" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#346c8a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="24" y="38" class="title" text-anchor="start">Final standalone validation · namespace peknik-ns · native release model-service-validation</text><text x="24" y="65" class="detail" text-anchor="start">Deployment snapshot from the October 6 record, including final restored-state checks. Source/configuration checked October 7.</text><rect x="24" y="115" width="270" height="155" rx="6" class="box"/><text x="42" y="143" class="lane-title" text-anchor="start">Local Python test client</text><text x="42" y="170" class="label" text-anchor="start">httpx + RationAI SDK</text><text x="42" y="197" class="label" text-anchor="start">127.0.0.1:18080</text><text x="42" y="224" class="detail" text-anchor="start">port-forward → service :8080</text><text x="42" y="248" class="detail" text-anchor="start">NativeWorkflowTests</text><rect x="370" y="115" width="355" height="220" rx="6" class="box"/><text x="388" y="143" class="lane-title" text-anchor="start">Scheduler pod</text><text x="388" y="170" class="label" text-anchor="start">container: execution-scheduler</text><text x="388" y="197" class="label" text-anchor="start">Uvicorn / FastAPI :8080</text><text x="388" y="224" class="label" text-anchor="start">API + ExecutionScheduler</text><text x="388" y="251" class="label" text-anchor="start">ExecutionWorker + renewal tasks</text><text x="388" y="278" class="label" text-anchor="start">Independent maintenance task</text><text x="388" y="309" class="detail" text-anchor="start">Python function calls share one process</text><rect x="820" y="115" width="590" height="205" rx="6" class="group"/><text x="838" y="143" class="lane-title" text-anchor="start">Native Ray head pod</text><text x="838" y="170" class="label" text-anchor="start">container: ray-head · Ray 2.58.0</text><text x="838" y="197" class="label" text-anchor="start">GCS / Serve controller / HTTP entry proxy</text><text x="838" y="224" class="label" text-anchor="start">serve-svc :8000 → internal replica routing</text><text x="838" y="251" class="detail" text-anchor="start">0 logical CPUs reserved for user deployments</text><text x="838" y="278" class="detail" text-anchor="start">Workflow and classifier actors are placed on the worker</text><text x="838" y="301" class="detail" text-anchor="start">KubeRay operator + autoscaler manage pods, outside request calls</text><rect x="820" y="385" width="590" height="280" rx="6" class="group"/><text x="838" y="415" class="lane-title" text-anchor="start">Native GPU worker pod · container: ray-worker</text><text x="838" y="442" class="detail" text-anchor="start">8 logical Ray CPUs / 1 logical GPU · A100 MIG 2g.20gb</text><rect x="838" y="463" width="258" height="149" rx="6" class="actor"/><text x="854" y="492" class="lane-title" text-anchor="start">Workflow replica process</text><text x="854" y="520" class="label" text-anchor="start">ProstateHeatmapApplication</text><text x="854" y="548" class="label" text-anchor="start">SlideHeatmapProcessor</text><text x="854" y="576" class="detail" text-anchor="start">4 CPUs · 8 GiB Ray reservation</text><text x="854" y="598" class="detail" text-anchor="start">Thread pool + libvips/OpenSlide</text><rect x="1120" y="463" width="272" height="149" rx="6" class="actor"/><text x="1136" y="492" class="lane-title" text-anchor="start">Classifier replica process</text><text x="1136" y="520" class="label" text-anchor="start">BinaryClassifier / ONNX</text><text x="1136" y="548" class="label" text-anchor="start">TensorRT + CUDA inference</text><text x="1136" y="576" class="detail" text-anchor="start">4 CPUs · 1 GPU · 12 GiB</text><text x="1136" y="598" class="detail" text-anchor="start">Batch up to 64 tiles</text><text x="838" y="641" class="detail" text-anchor="start">One replica each; autoscaling_config: null explicitly clears inherited auto policy</text><rect x="370" y="405" width="355" height="133" rx="6" class="box"/><text x="388" y="436" class="lane-title" text-anchor="start">External PostgreSQL pod</text><text x="388" y="465" class="label" text-anchor="start">postgres:16-alpine · SQL service :5432</text><text x="388" y="492" class="label" text-anchor="start">Execution rows + leases + results</text><text x="388" y="519" class="detail" text-anchor="start">Managed separately from the Helm chart</text><rect x="370" y="600" width="355" height="95" rx="6" class="box"/><text x="388" y="629" class="lane-title" text-anchor="start">Database data PVC</text><text x="388" y="656" class="detail" text-anchor="start">model-service-validation-postgres-data</text><text x="388" y="680" class="detail" text-anchor="start">2 GiB NFS · /var/lib/postgresql/data</text><rect x="24" y="762" width="701" height="184" rx="6" class="box"/><text x="42" y="792" class="lane-title" text-anchor="start">Image and artifact storage · filesystem IO</text><text x="42" y="823" class="detail" text-anchor="start">Inputs: model-service-validation-shared → /mnt/validation</text><text x="42" y="850" class="detail" text-anchor="start">Outputs: model-service-validation-full-wsi-outputs</text><text x="42" y="876" class="detail" text-anchor="start">→ /mnt/validation/outputs and /mnt/validation/.workflow-attempts</text><text x="42" y="903" class="detail" text-anchor="start">Both scheduler and GPU worker mount these claims. JSON carries paths.</text><text x="42" y="929" class="detail" text-anchor="start">Worker also mounts scratch at /mnt/scratch and TensorRT cache at /mnt/cache.</text><rect x="820" y="762" width="590" height="184" rx="6" class="box"/><text x="838" y="792" class="lane-title" text-anchor="start">Initialization and retained cache</text><text x="838" y="823" class="detail" text-anchor="start">MLflow HTTP → model artifact during reconfigure/cache fill</text><text x="838" y="850" class="detail" text-anchor="start">ONNX session lives in classifier process; inference uses loaded weights</text><text x="838" y="876" class="detail" text-anchor="start">The numerical verifier used the cached artifact; no extra MLflow read</text><text x="838" y="903" class="detail" text-anchor="start">EMPAIA AppService is disabled. Legacy RayService is separate.</text><text x="838" y="929" class="detail" text-anchor="start">Container images contain code; actor placement decides where it executes.</text><path d="M 294 190 L 370 190" class="edge http" marker-end="url(#http)"/><text x="332" y="181" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 725 213 L 820 213" class="edge http" marker-end="url(#http)"/><text x="771" y="202" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 548 335 L 548 405" class="edge sql" marker-end="url(#sql)"/><text x="560" y="376" class="kind kind-sql" text-anchor="start">SQL</text><path d="M 548 538 L 548 600" class="edge files" marker-end="url(#files)"/><text x="560" y="574" class="kind kind-files" text-anchor="start">FILES</text><path d="M 967 320 L 967 385" class="edge ray" marker-end="url(#ray)"/><text x="979" y="356" class="kind kind-ray" text-anchor="start">RAY</text><path d="M 1096 537 L 1120 537" class="edge ray" marker-end="url(#ray)"/><path d="M 820 638 H 760 V 730 H 640 V 762" class="edge files" marker-end="url(#files)"/><text x="747" y="719" class="detail" text-anchor="end">Worker reads / writes mounted files</text><path d="M 370 295 H 320 V 722 H 220 V 762" class="edge files" marker-end="url(#files)"/><text x="308" y="711" class="detail" text-anchor="end">Scheduler validates paths</text><text x="24" y="978" class="detail" text-anchor="start">Logical topology, not a packet trace. Serve may also run worker proxies; both sequence diagrams keep proxy routing distinct from replica code.</text></svg>
