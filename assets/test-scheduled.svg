<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1556 1788" role="img" aria-labelledby="title desc">
<title id="title">Scheduled workflow · commit admission, release the client, process, then poll</title><desc id="desc">Read downward. Each row names the function or operation and the transport. Actor lanes identify separate processes, even when they share a container. Dashed arrows are returns. Polling and lease renewal can overlap computation.</desc>
<style>
  text { font-family: system-ui, sans-serif; fill: #26332f; }
  .title { font-size: 25px; font-weight: 600; }
  .label { font-size: 17px; }
  .detail { font-size: 14px; fill: #5d6c64; }
  .lane-title { font-size: 17px; font-weight: 600; }
  .kind { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .box { fill: #faf8f3; stroke: #ccd5cb; stroke-width: 1.5; }
  .group { fill: #f3f1e9; stroke: #839589; stroke-width: 1.5; stroke-dasharray: 7 5; }
  .actor { fill: #fff; stroke: #63518f; stroke-width: 1.5; }
  .lifeline { stroke: #ccd5cb; stroke-dasharray: 4 5; }
  .row { stroke: #e8ece4; }
  .edge { fill: none; stroke-width: 2; }
  .returning { stroke-dasharray: 7 5; }
  .local { stroke: #46534b; } .kind-local { fill: #46534b; }
  .http { stroke: #17634d; } .kind-http { fill: #17634d; }
  .ray { stroke: #63518f; } .kind-ray { fill: #63518f; }
  .sql { stroke: #996122; } .kind-sql { fill: #996122; }
  .files { stroke: #346c8a; } .kind-files { fill: #346c8a; }
</style><defs><marker id="local" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#46534b"/></marker><marker id="http" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#17634d"/></marker><marker id="ray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#63518f"/></marker><marker id="sql" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#996122"/></marker><marker id="files" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#346c8a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/><text x="18" y="34" class="title" text-anchor="start">Scheduled workflow · commit admission, release the client, process, then poll</text><text x="18" y="60" class="detail" text-anchor="start">Read downward · dashed arrows return · LOCAL stays in one process · RAY crosses actor processes</text><rect x="381" y="82" width="150" height="61" rx="6" class="box"/><text x="456" y="106" class="lane-title" text-anchor="middle">Test client</text><text x="456" y="129" class="detail" text-anchor="middle">local Python</text><path d="M 456 145 V 1664" class="lifeline"/><rect x="549" y="82" width="150" height="61" rx="6" class="box"/><text x="624" y="106" class="lane-title" text-anchor="middle">API + worker</text><text x="624" y="129" class="detail" text-anchor="middle">scheduler process</text><path d="M 624 145 V 1664" class="lifeline"/><rect x="717" y="82" width="150" height="61" rx="6" class="box"/><text x="792" y="106" class="lane-title" text-anchor="middle">PostgreSQL</text><text x="792" y="129" class="detail" text-anchor="middle">database container</text><path d="M 792 145 V 1664" class="lifeline"/><rect x="885" y="82" width="150" height="61" rx="6" class="box"/><text x="960" y="106" class="lane-title" text-anchor="middle">Serve proxy</text><text x="960" y="129" class="detail" text-anchor="middle">Ray entry point</text><path d="M 960 145 V 1664" class="lifeline"/><rect x="1053" y="82" width="150" height="61" rx="6" class="box"/><text x="1128" y="106" class="lane-title" text-anchor="middle">Workflow actor</text><text x="1128" y="129" class="detail" text-anchor="middle">GPU worker</text><path d="M 1128 145 V 1664" class="lifeline"/><rect x="1221" y="82" width="150" height="61" rx="6" class="box"/><text x="1296" y="106" class="lane-title" text-anchor="middle">Classifier actor</text><text x="1296" y="129" class="detail" text-anchor="middle">same GPU worker</text><path d="M 1296 145 V 1664" class="lifeline"/><rect x="1389" y="82" width="150" height="61" rx="6" class="box"/><text x="1464" y="106" class="lane-title" text-anchor="middle">Mounted files</text><text x="1464" y="129" class="detail" text-anchor="middle">input/output PVCs</text><path d="M 1464 145 V 1664" class="lifeline"/><path d="M 18 205 H 1538" class="row"/><text x="18" y="177" class="label" text-anchor="start">1. POST public /v1/.../schedule</text><text x="18" y="197" class="detail" text-anchor="start">Native test starts with httpx.Client.post; JSON + key + timeout</text><path d="M 456 180 L 624 180" class="edge http" marker-end="url(#http)"/><text x="540" y="170" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 259 H 1538" class="row"/><text x="18" y="231" class="label" text-anchor="start">2. Identify standalone request</text><text x="18" y="251" class="detail" text-anchor="start">api.submit → scheduler.schedule → standalone.identify</text><path d="M 624 222 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="668" y="236" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 313 H 1538" class="row"/><text x="18" y="285" class="label" text-anchor="start">3. Look up provider-scoped identity</text><text x="18" y="305" class="detail" text-anchor="start">postgres.find_submission checks key and fingerprint</text><path d="M 624 288 L 792 288" class="edge sql" marker-end="url(#sql)"/><text x="708" y="278" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 367 H 1538" class="row"/><text x="18" y="339" class="label" text-anchor="start">4. Validate shared-storage inputs</text><text x="18" y="359" class="detail" text-anchor="start">New admission only: standalone.prepare → input_path</text><path d="M 624 342 L 1464 342" class="edge files" marker-end="url(#files)"/><text x="1044" y="332" class="kind kind-files" text-anchor="middle">FILES</text><path d="M 18 421 H 1538" class="row"/><text x="18" y="393" class="label" text-anchor="start">5. Admit queued processing work</text><text x="18" y="413" class="detail" text-anchor="start">postgres.admit → transitions.admit → INSERT + uniqueness</text><path d="M 624 396 L 792 396" class="edge sql" marker-end="url(#sql)"/><text x="708" y="386" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 475 H 1538" class="row"/><text x="18" y="447" class="label" text-anchor="start">6. Commit before admission returns</text><text x="18" y="467" class="detail" text-anchor="start">Psycopg connection context exits successfully</text><path d="M 792 450 L 624 450" class="edge sql returning" marker-end="url(#sql)"/><text x="708" y="440" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 529 H 1538" class="row"/><text x="18" y="501" class="label" text-anchor="start">7. Return 202 and execution ID</text><text x="18" y="521" class="detail" text-anchor="start">Client can close this request; execution remains durable</text><path d="M 624 504 L 456 504" class="edge http returning" marker-end="url(#http)"/><text x="540" y="494" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 583 H 1538" class="row"/><text x="18" y="555" class="label" text-anchor="start">8. Replay and conflicting-key checks</text><text x="18" y="575" class="detail" text-anchor="start">Equivalent request → 200; changed timeout → 409</text><path d="M 456 558 L 624 558" class="edge http" marker-end="url(#http)"/><text x="540" y="548" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 637 H 1538" class="row"/><text x="18" y="609" class="label" text-anchor="start">9. Read identity and fingerprint again</text><text x="18" y="629" class="detail" text-anchor="start">Replay avoids preparation and additional processing</text><path d="M 624 612 L 792 612" class="edge sql" marker-end="url(#sql)"/><text x="708" y="602" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 691 H 1538" class="row"/><text x="18" y="663" class="label" text-anchor="start">10. Claim processing when due</text><text x="18" y="683" class="detail" text-anchor="start">worker.run_once → claim_due; running + lease + fencing token</text><path d="M 624 666 L 792 666" class="edge sql" marker-end="url(#sql)"/><text x="708" y="656" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 745 H 1538" class="row"/><text x="18" y="717" class="label" text-anchor="start">11. POST internal workflow request</text><text x="18" y="737" class="detail" text-anchor="start">worker._execute → dispatch; attempt context + header</text><path d="M 624 720 L 960 720" class="edge http" marker-end="url(#http)"/><text x="792" y="710" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 799 H 1538" class="row"/><text x="18" y="771" class="label" text-anchor="start">12. Route to the workflow replica</text><text x="18" y="791" class="detail" text-anchor="start">ProstateHeatmapApplication.run → WorkflowApplication.run</text><path d="M 960 774 L 1128 774" class="edge ray" marker-end="url(#ray)"/><text x="1044" y="764" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 853 H 1538" class="row"/><text x="18" y="825" class="label" text-anchor="start">13. Run the same heatmap implementation</text><text x="18" y="845" class="detail" text-anchor="start">SharedStorageAccess → ProstateHeatmapWorkflow → processor</text><path d="M 1128 816 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="1172" y="830" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 907 H 1538" class="row"/><text x="18" y="879" class="label" text-anchor="start">14. Get model tile configuration</text><text x="18" y="899" class="detail" text-anchor="start">RayHeatmapPredictor.configuration → get_config.remote</text><path d="M 1128 882 L 1296 882" class="edge ray" marker-end="url(#ray)"/><text x="1212" y="872" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 961 H 1538" class="row"/><text x="18" y="933" class="label" text-anchor="start">15. Read slide and mask tiles</text><text x="18" y="953" class="detail" text-anchor="start">OpenSlide reads; no WSI upload through either HTTP hop</text><path d="M 1128 936 L 1464 936" class="edge files" marker-end="url(#files)"/><text x="1296" y="926" class="kind kind-files" text-anchor="middle">FILES</text><path d="M 18 1015 H 1538" class="row"/><text x="18" y="987" class="label" text-anchor="start">16. Predict selected tile arrays</text><text x="18" y="1007" class="detail" text-anchor="start">RayHeatmapPredictor.predict → predict.remote</text><path d="M 1128 990 L 1296 990" class="edge ray" marker-end="url(#ray)"/><text x="1212" y="980" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 1069 H 1538" class="row"/><text x="18" y="1041" class="label" text-anchor="start">17. Batch and run ONNX on GPU</text><text x="18" y="1061" class="detail" text-anchor="start">Same classifier actor and cached weights as immediate mode</text><path d="M 1296 1032 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="1340" y="1046" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 1123 H 1538" class="row"/><text x="18" y="1095" class="label" text-anchor="start">18. Return scores and reconstruct image</text><text x="18" y="1115" class="detail" text-anchor="start">Overlap accumulation → padded-grid resize → crop</text><path d="M 1296 1098 L 1128 1098" class="edge ray returning" marker-end="url(#ray)"/><text x="1212" y="1088" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 1177 H 1538" class="row"/><text x="18" y="1149" class="label" text-anchor="start">19. Complete attempt-isolated TIFF</text><text x="18" y="1169" class="detail" text-anchor="start">.workflow-attempts/&lt;attempt-hash&gt;/outputs/...tiff</text><path d="M 1128 1152 L 1464 1152" class="edge files" marker-end="url(#files)"/><text x="1296" y="1142" class="kind kind-files" text-anchor="middle">FILES</text><path d="M 18 1231 H 1538" class="row"/><text x="18" y="1203" class="label" text-anchor="start">20. Validate, clean up and return result</text><text x="18" y="1223" class="detail" text-anchor="start">Named artifact reference; separate actor return</text><path d="M 1128 1206 L 960 1206" class="edge ray returning" marker-end="url(#ray)"/><text x="1044" y="1196" class="kind kind-ray" text-anchor="middle">RAY</text><path d="M 18 1285 H 1538" class="row"/><text x="18" y="1257" class="label" text-anchor="start">21. Return internal HTTP result</text><text x="18" y="1277" class="detail" text-anchor="start">dispatch.run → ProcessingSucceeded settlement value</text><path d="M 960 1260 L 624 1260" class="edge http returning" marker-end="url(#http)"/><text x="792" y="1250" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 1339 H 1538" class="row"/><text x="18" y="1311" class="label" text-anchor="start">22. Store result and enqueue finish</text><text x="18" y="1331" class="detail" text-anchor="start">settle: running + result + work_kind=provider_finish</text><path d="M 624 1314 L 792 1314" class="edge sql" marker-end="url(#sql)"/><text x="708" y="1304" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 1393 H 1538" class="row"/><text x="18" y="1365" class="label" text-anchor="start">23. Claim provider-finish work</text><text x="18" y="1385" class="detail" text-anchor="start">Next worker pass; separate claim and fencing token</text><path d="M 624 1368 L 792 1368" class="edge sql" marker-end="url(#sql)"/><text x="708" y="1358" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 1447 H 1538" class="row"/><text x="18" y="1419" class="label" text-anchor="start">24. Finish standalone provider</text><text x="18" y="1439" class="detail" text-anchor="start">StandaloneProviderAdapter.finish is a no-op</text><path d="M 624 1410 h 35 v 19 h -35" class="edge local" marker-end="url(#local)"/><text x="668" y="1424" class="kind kind-local" text-anchor="start">LOCAL</text><path d="M 18 1501 H 1538" class="row"/><text x="18" y="1473" class="label" text-anchor="start">25. Settle finish as succeeded</text><text x="18" y="1493" class="detail" text-anchor="start">ProviderFinishSucceeded clears pending work and lease</text><path d="M 624 1476 L 792 1476" class="edge sql" marker-end="url(#sql)"/><text x="708" y="1466" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 1555 H 1538" class="row"/><text x="18" y="1527" class="label" text-anchor="start">26. Poll GET /v1/executions/{id}</text><text x="18" y="1547" class="detail" text-anchor="start">SDK executions.get; each poll is a new HTTP request</text><path d="M 456 1530 L 624 1530" class="edge http" marker-end="url(#http)"/><text x="540" y="1520" class="kind kind-http" text-anchor="middle">HTTP</text><path d="M 18 1609 H 1538" class="row"/><text x="18" y="1581" class="label" text-anchor="start">27. Read durable execution snapshot</text><text x="18" y="1601" class="detail" text-anchor="start">scheduler.get → postgres.get → scheduler._view</text><path d="M 624 1584 L 792 1584" class="edge sql" marker-end="url(#sql)"/><text x="708" y="1574" class="kind kind-sql" text-anchor="middle">SQL</text><path d="M 18 1663 H 1538" class="row"/><text x="18" y="1635" class="label" text-anchor="start">28. Return 200 with succeeded + result</text><text x="18" y="1655" class="detail" text-anchor="start">Public result appears after provider finish succeeds</text><path d="M 624 1638 L 456 1638" class="edge http returning" marker-end="url(#http)"/><text x="540" y="1628" class="kind kind-http" text-anchor="middle">HTTP</text><text x="18" y="1698" class="detail" text-anchor="start">API, worker, lease renewal and maintenance are asyncio tasks in the same scheduler process, not separate pods.</text><text x="18" y="1722" class="detail" text-anchor="start">The test polls every 1 s during processing. Lease renew runs about every 20 s for the 60 s lease; maintenance polls every 0.5 s.</text><text x="18" y="1746" class="detail" text-anchor="start">Replay checks, polling and maintenance can interleave with claims. Rows explain causality, not an observed packet-by-packet timeline.</text><text x="18" y="1770" class="detail" text-anchor="start">The HTTP responses for replay and conflict are summarized in row 8. The final poll is shown after finish; earlier polls omit result.</text></svg>
