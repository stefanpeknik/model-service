# The prostate classifier as a preprocessing app, which takes only the slide, for
# installations that start apps from a slide (e.g. the case browser's slide
# jobs). The whole slide is processed; no quality-control mask yet.
builder: heatmap
model: prostate-classifier-1
inputs: [slide]
empaia:
  name: Prostate Heatmap
  name_short: ProstHM
  namespace: org.empaia.rationai.prostate_cls_preprocessing.v3.0
  description: Classifies prostate tissue over the whole slide and produces a heatmap
  mode: preprocessing
  permissions:
    data_transmission_to_external_service_provider: true
