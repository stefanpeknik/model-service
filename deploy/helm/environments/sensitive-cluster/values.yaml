# rationai-jobs-ns: the cluster model-service ran on before this platform
# (upstream main: Serve applications only). It deploys the whole platform; the
# render fails until these are filled in, each named by its error:
# - rayImage.tag, rayGpuImage.tag, controlPlane.image.tag: the images to run;
# - secrets.huggingface.token, in secrets.yaml beside this file (untracked).
# Runs write their outputs under /mnt/projects: `projects-rw`, the writable
# claim the workers mount there too (/mnt/data is the read-only `data-ro`).
# The chart creates PostgreSQL, its database Secret and the cache claims.
# EMPAIA is off here.
environment: sensitive-cluster
modelSettings:
  env:
    MLFLOW_TRACKING_URI: http://mlflow.rationai-mlflow:5000

sharedStorageRoots: [/mnt/data, /mnt/projects]

storage:
  storageClassName: nfs-csi

workers: [cpu, gpu]

# Always, as this cluster pulled before.
rayImage:
  repository: cerit.io/rationai/model-service-ray-cpu
  tag: ""
  pullPolicy: Always
rayGpuImage:
  repository: cerit.io/rationai/model-service-ray
  tag: ""
  pullPolicy: Always

controlPlane:
  enabled: true
  image:
    tag: ""
  sharedStorage:
    existingClaim: projects-rw
    mountPath: /mnt/projects
