# The secret values one environment passes to the chart. Copy this to
# environments/<env>/secrets.yaml (git ignores it), fill it in and install with
#   helm upgrade --install model-service deploy/helm -n <namespace> \
#     -f deploy/helm/environments/<env>/values.yaml \
#     -f deploy/helm/environments/<env>/secrets.yaml
# Preview with --dry-run=server, never by applying `helm template` output: a
# render without the cluster can't read the stored database Secret back and
# shows freshly generated credentials.
secrets:
  # Optional, and only read on the first install: left out, the chart
  # generates both. Afterwards it keeps what <release>-db holds, and a
  # different value here fails the upgrade instead of locking the control
  # plane out of PostgreSQL. Letters and digits only for the password.
  database:
    password: ""
    providerContextKey: ""  # URL-safe base64 of 32 random bytes
  # Required: what the model workers download gated Hugging Face weights with.
  huggingface:
    token: ""
  # Only where the MLflow server asks for credentials (the public one does).
  mlflow:
    username: ""
    token: ""
