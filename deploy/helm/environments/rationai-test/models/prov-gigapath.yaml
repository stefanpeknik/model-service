# yaml-language-server: $schema=../../../../../catalog/.schemas/models.patch.schema.json
# The test cluster runs one replica on half a GPU, with smaller batches and
# fewer requests in flight: the temporary copy the golden references were
# recorded with.
batching: {max_size: 64}
resources: {gpus: 0.5, cpus: 1}
serving: {max_replicas: 1, target_ongoing_requests: 128, max_ongoing_requests: 256, max_queued_requests: 2048, downscale_delay_s: 300}
