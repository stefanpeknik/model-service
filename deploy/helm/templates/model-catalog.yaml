{{- /*
The control plane's catalog, rendered from the same files as the Serve config. The control plane
mounts it as a directory and reloads it when kubelet updates the files, so a
catalog change does not restart the control plane.

- catalog.json: the deployed models and pipelines after the
  environment's patches.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-model-catalog
  namespace: {{ .Release.Namespace }}
data:
  catalog.json: |
    {{- dict "models" (include "model-service.models" . | fromJson) "pipelines" (include "model-service.pipelines" . | fromJson) | toJson | nindent 4 }}
