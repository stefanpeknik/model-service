{{- /*
The release's Secrets. Values come from the environment's untracked
secrets.yaml (see environments/secrets.example.yaml). The database password
and the provider-context key are generated on the first install when left
out, and read back from the cluster on every upgrade, so they never change.
*/}}
{{- $_ := include "model-service.environment" . }}
{{- $dbName := printf "%s-db" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $dbName).data | default dict }}
{{- $database := .Values.secrets.database | default dict }}
{{- $existingPassword := get $existing "postgres-password" | default "" | b64dec }}
{{- $existingKey := get $existing "provider-context-key" | default "" | b64dec }}
{{- /* PostgreSQL keeps the password it started with and stored contexts need their
key, so once the Secret exists its values win and a different one is an error. */}}
{{- if and $existingPassword $database.password (ne $database.password $existingPassword) }}
{{- fail (printf "secrets.database.password differs from the one in Secret %s; the database still uses the old one. Remove it from secrets.yaml." $dbName) }}
{{- end }}
{{- if and $existingKey $database.providerContextKey (ne $database.providerContextKey $existingKey) }}
{{- fail (printf "secrets.database.providerContextKey differs from the one in Secret %s; stored provider contexts need the old one. Remove it from secrets.yaml." $dbName) }}
{{- end }}
{{- $password := $existingPassword | default $database.password | default (randAlphaNum 48) }}
{{- $contextKey := $existingKey | default $database.providerContextKey | default (randBytes 32 | replace "+" "-" | replace "/" "_") }}
{{- if not (regexMatch "^[A-Za-z0-9]+$" $password) }}
{{- fail "secrets.database.password must be letters and digits only: it goes into the database URL unescaped" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{43}=$" $contextKey) }}
{{- fail "secrets.database.providerContextKey must be URL-safe base64 of 32 bytes" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $password | quote }}
  database-url: {{ printf "postgresql://model_service:%s@%s-postgres:5432/model_service" $password .Release.Name | quote }}
  provider-context-key: {{ $contextKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-huggingface
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ required "secrets.huggingface.token is required (environments/<env>/secrets.yaml)" (.Values.secrets.huggingface | default dict).token | quote }}
{{- with .Values.secrets.mlflow }}
{{- if .username }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-mlflow
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
  username: {{ .username | quote }}
  token: {{ required "secrets.mlflow.token is required with a username" .token | quote }}
{{- end }}
{{- end }}
