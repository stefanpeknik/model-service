inference:
  contract: spatial-scores
# Offered in EMPAIA as one app per mode; the facade registers them at startup.
empaia:
  name: Prostate cancer
  name_short: ProstHM
  description: Classifies prostate tissue and shows the scores as a heatmap over the slide.
  modes: [standalone, preprocessing]
  # The AigoPath case browser's display settings (xOpat shader and its params).
  viewer:
    inputs:
      slide: {target: xopat, lossless: false}
    outputs:
      heatmap:
        render: shader
        label: Prostate Heatmap
        visible: true
        shader:
          type: heatmap
          params: {threshold: 65, opacity: 0.5, color: "#ffff00"}
serve:
  name: prostate-classifier-1
  import_path: model_service.models.binary_classifier:app
  route_prefix: /prostate-classifier-1
  deployments:
    - name: BinaryClassifier
      max_ongoing_requests: 512
      max_queued_requests: 4096
      autoscaling_config:
        min_replicas: 0
        max_replicas: 4
        target_ongoing_requests: 128
      ray_actor_options:
        num_cpus: 4
        num_gpus: 1
        memory: 12884901888
        runtime_env:
          env_vars:
            MLFLOW_TRACKING_URI: http://mlflow.rationai-mlflow:5000
      user_config:
        tile_size: 512
        output_tile_size: 1
        n_channels: 1
        mpp: 0.468
        max_batch_size: 256
        batch_wait_timeout_s: 0.05
        intra_op_num_threads: 4
        trt_max_workspace_size: 8589934592
        trt_cache_path: /mnt/cache/trt_cache/binary-classifier-1/b256
        trt_builder_optimization_level: 3
        model:
          _target_: model_service.models.artifacts:mlflow
          artifact_uri: mlflow-artifacts:/65/aebc892f526047249b972f200bef4381/artifacts/checkpoints/epoch=0-step=6972/prostate_model_norm.onnx
