# CPU-only spatial-scores model returning a constant score; used to exercise
# builders and scheduling without a GPU.
inference:
  contract: spatial-scores
empaia:
  name: Constant test
  name_short: ConstHM
  description: A test model that gives every tile the same score; it checks the pipeline, not the tissue.
  modes: [standalone, preprocessing]
  viewer:
    inputs:
      slide: {target: xopat, lossless: false}
    outputs:
      heatmap:
        render: shader
        label: Constant Heatmap
        visible: true
        shader:
          type: heatmap
          params: {threshold: 65, opacity: 0.5, color: "#ffff00"}
serve:
  name: constant-classifier
  import_path: testing.constant_classifier:app
  route_prefix: /constant-classifier
  deployments:
    - name: ConstantClassifier
      num_replicas: 1
      ray_actor_options:
        num_cpus: 0.5
      user_config:
        tile_size: 128
        output_tile_size: 1
        n_channels: 1
        mpp: 0.5
