inference:
  contract: spatial-scores
serve:
  name: prostate-classifier-1
  import_path: model_service.models.binary_classifier:app
  route_prefix: /prostate-classifier-1
  deployments:
    - name: BinaryClassifier
      max_ongoing_requests: 128
      max_queued_requests: 1024
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1
        target_ongoing_requests: 128
        downscale_delay_s: 300
      ray_actor_options:
        num_cpus: 3
        num_gpus: 0.5
        memory: 8589934592
        runtime_env:
          env_vars:
            MLFLOW_TRACKING_URI: https://mlflow.rationai.cloud.e-infra.cz
      user_config:
        tile_size: 512
        output_tile_size: 1
        n_channels: 1
        mpp: 0.468
        max_batch_size: 64
        batch_wait_timeout_s: 0.05
        intra_op_num_threads: 3
        trt_max_workspace_size: 8589934592
        # Same engine cache as the October checkpoint, so no TensorRT rebuild.
        trt_cache_path: /mnt/cache/trt_cache/binary-classifier-1/full-wsi-ray258-b64
        trt_builder_optimization_level: 3
        model:
          _target_: model_service.models.artifacts:mlflow
          artifact_uri: mlflow-artifacts:/169/17dda4dc3f7449478208e87016ce7d86/artifacts/checkpoints/epoch=0-step=6972/prostate_model_norm.onnx
