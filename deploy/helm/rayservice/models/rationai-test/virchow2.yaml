# The test instance's copy of ../virchow2.yaml, tuned for the test cluster:
# one replica on half a GPU, with smaller batches and fewer requests in flight.
contract: tile-embedding
implementation: virchow2.Virchow2

# Ray Serve options for the whole application, rarely needed: the first
# start downloads the weights.
application:
  runtime_env:
    config:
      setup_timeout_seconds: 1800

# How the model runs on Ray Serve: replicas, resources, batching, weights.
deployment:
  max_ongoing_requests: 256
  max_queued_requests: 2048
  autoscaling_config:
    min_replicas: 0
    max_replicas: 1
    target_ongoing_requests: 128
    downscale_delay_s: 300
  ray_actor_options:
    num_cpus: 1
    num_gpus: 0.5
    memory: 8589934592
    runtime_env:
      env_vars:
        HF_HOME: /mnt/huggingface_cache
  user_config:
    tile_size: 224
    mpp: 0.5  # 20x; the resolution the published encoder was trained at
    # What `embed` returns per tile; the implementation refuses any other list.
    summaries:
      - global
      - local_mean
    max_batch_size: 64
    batch_wait_timeout_s: 0.05
    model:
      repo_id: paige-ai/Virchow2
