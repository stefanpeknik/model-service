# peknik-ns test deployment. One CPU worker hosts builders and the constant
# model; one MIG GPU worker (scales to zero) hosts GPU models.
models:
  - peknik/prostate-classifier-1
  - peknik/constant-classifier
  - peknik/virchow2

builders:
  heatmap:
    deployment:
      max_ongoing_requests: 1
      max_queued_requests: 2
      backpressure_config:
        status_code: 429
        retry_after_s: 5
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1
        target_ongoing_requests: 1
        downscale_delay_s: 120
      ray_actor_options:
        num_cpus: 2
        memory: 4294967296
    userConfig:
      num_threads: 2
      max_concurrent_tasks: 32
  tile-embeddings:
    deployment:
      max_ongoing_requests: 1
      max_queued_requests: 2
      backpressure_config:
        status_code: 429
        retry_after_s: 5
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1
        target_ongoing_requests: 1
        downscale_delay_s: 120
      ray_actor_options:
        num_cpus: 1
        memory: 2147483648
    userConfig:
      num_threads: 1
      max_concurrent_tasks: 32

sharedStorageRoots: [/mnt/shared]

workers:
  - peknik-cpu-workers
  - peknik-gpu-workers

rayImage:
  # Thin code layer over the October GPU image (same Harbor repository, so
  # its large base layers are not uploaded again).
  repository: cerit.io/stefanpeknik/model-service-workflow-gpu
  tag: empaia-8
  pullPolicy: IfNotPresent

storage:
  storageClassName: nfs-csi
  outputSize: 32Gi
  scratchSize: 32Gi

validation:
  appService:
    enabled: false

executionScheduler:
  enabled: true
  replicas: 1
  image:
    repository: cerit.io/stefanpeknik/model-service-scheduler
    tag: empaia-8
    pullPolicy: IfNotPresent
  database:
    existingSecret: model-service-validation-db
    urlKey: database-url
  encryption:
    existingSecret: model-service-validation-db
    keyKey: provider-context-key
  sharedStorage:
    existingClaim: model-service-validation-full-wsi-outputs
    mountPath: /mnt/shared
  inferenceTimeoutSeconds: 900
  defaultDeadlineSeconds: 21600
  maximumDeadlineSeconds: 86400
  processingAttempts: 2
  maxConcurrentExecutions: 4

empaia:
  enabled: true
  # The mock AppService in deploy/k8s/peknik-ns/empaia-mock.yaml, and the
  # EMPAIA test instance's AppService under the short name its Workbench
  # Daemon hands to JES; the search domain makes that name resolve here.
  apiUrls:
    - "http://empaia-mock-app-service.peknik-ns.svc:8000"
    - "http://test-jobs-app-api:10009"
  dnsSearches: ["rationai-infra-test-ns.svc.cluster.local"]
  # The scratch volume, which the peknik workers already mount at /mnt/scratch.
  workspaceRoot: /mnt/scratch
  workspaceClaim: model-service-validation-full-wsi-scratch
  # Read the mock's slide through the App API, as in the EMPAIA test instance.
  slideAccess: http
