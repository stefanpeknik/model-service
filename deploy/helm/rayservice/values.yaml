# Model deployments: files under models/ (without .yaml). Each file holds the
# model's `inference` declaration and its Ray Serve application (`serve`).
# Adding a compatible model = add a file here and list it.
models:
  - prostate-classifier-1
  - episeg-1
  - virchow2
  - prov-gigapath

# Builders run `builders.serve:app`; the key is the builder ID.
builders:
  heatmap:
    deployment:
      max_ongoing_requests: 1
      max_queued_requests: 4
      backpressure_config:
        status_code: 429
        retry_after_s: 5
      autoscaling_config:
        min_replicas: 0
        max_replicas: 4
        target_ongoing_requests: 1
      ray_actor_options:
        num_cpus: 8
        memory: 12884901888
    userConfig:
      num_threads: 8
      max_concurrent_tasks: 16
  tile-embeddings:
    deployment:
      max_ongoing_requests: 1
      max_queued_requests: 4
      backpressure_config:
        status_code: 429
        retry_after_s: 5
      autoscaling_config:
        min_replicas: 0
        max_replicas: 2
        target_ongoing_requests: 1
      ray_actor_options:
        num_cpus: 2
        memory: 4294967296
    userConfig:
      num_threads: 2
      max_concurrent_tasks: 8

# Roots callers may name in shared-storage requests (facade and builders).
sharedStorageRoots: [/mnt/data, /mnt/projects]

workers:
  - cpu-workers
  - mig20-workers

rayImage:
  repository: rayproject/ray
  tag: 2.58.0-py312
  pullPolicy: Always

executionScheduler:
  enabled: false
  replicas: 2
  image:
    repository: cerit.io/rationai/model-service-execution-scheduler
    tag: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: ""
    urlKey: database-url
  encryption:
    existingSecret: ""
    keyKey: provider-context-key
  sharedStorage:
    existingClaim: ""
    mountPath: /mnt/data
  rayServeOrigin: ""
  inferenceModelOrigins: {}
  leaseSeconds: 60
  workerPollSeconds: 0.5
  processingAttempts: 3
  providerFinishAttempts: 3
  initialBackoffSeconds: 5
  maximumBackoffSeconds: 300
  defaultDeadlineSeconds: 21600
  maximumDeadlineSeconds: 86400
  perModelLimit: 1
  maxConcurrentExecutions: 4
  # POST /v1/models/{id}/schedule: one execution per tile, with its own
  # slots so tiles and builders cannot starve each other. Worst-case facade
  # memory for running tiles is maxConcurrent x (maxRequestBytes + maxResultBytes).
  scheduledInference:
    perModelLimit: 32
    maxConcurrent: 32
    maxRequestBytes: 2097152
    maxResultBytes: 4194304
    retentionSeconds: 86400
  empaia:
    enabled: false
    gatewayFactory: model_service.providers.empaia.http_gateway:create_http_gateway
    # AppService URLs that may receive EMPAIA job credentials.
    apiUrls: []
    workspaceRoot: /mnt/model-service-executions
    workspaceClaim: ""
    # Apps served at /v1/empaia/apps/<app>; each is empaia-apps/<app>.yaml.
    # In EMPAIA, register the app's image as http::<JES target>/<app>.
    apps: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
