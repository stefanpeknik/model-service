# Model deployments: files under models/ (without .yaml). Each file holds the
# model's `inference` declaration and its Ray Serve application (`serve`).
# Adding a compatible model = add a file here and list it.
models:
  - prostate-classifier-1
  - episeg-1
  - virchow2
  - prov-gigapath

# Builders run `builder_deployment.serve:app`; the key is the builder ID.
# `builders: null` in an override file deploys the models for plain Ray Serve
# inference only (`{}` would merge with these defaults).
builders:
  heatmap:
    deployment:
      max_ongoing_requests: 1
      max_queued_requests: 4
      backpressure_config:
        status_code: 429
        retry_after_s: 5
      autoscaling_config:
        min_replicas: 0
        max_replicas: 4
        target_ongoing_requests: 1
      ray_actor_options:
        num_cpus: 8
        memory: 12884901888
    userConfig:
      num_threads: 8
      max_concurrent_tasks: 16

# Roots callers may name in shared-storage requests (API and builders).
sharedStorageRoots: [/mnt/data, /mnt/projects]

workers:
  - cpu-workers
  - mig20-workers

rayImage:
  repository: rayproject/ray
  tag: 2.58.0-py312
  pullPolicy: Always

api:
  enabled: false
  replicas: 2
  image:
    repository: cerit.io/rationai/model-service-api
    tag: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: ""
    urlKey: database-url
  encryption:
    existingSecret: ""
    keyKey: provider-context-key
  sharedStorage:
    existingClaim: ""
    mountPath: /mnt/data
  rayServeOrigin: ""
  leaseSeconds: 300
  workerPollSeconds: 0.5
  processingAttempts: 3
  providerFinishAttempts: 3
  initialBackoffSeconds: 5
  maximumBackoffSeconds: 300
  defaultDeadlineSeconds: 21600
  maximumDeadlineSeconds: 86400
  perModelLimit: 1
  maxConcurrentExecutions: 4
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

# EMPAIA is on when apiUrls lists an AppService. Empty (the default) refuses
# every EMPAIA job and leaves out all EMPAIA env, volumes, DNS settings and
# marketplace registration; the rest of this block is then ignored.
empaia:
  # AppService URLs that may receive EMPAIA job credentials.
  apiUrls: []
  workspaceRoot: /mnt/model-service-executions
  # Shared by the API and the builder workers: builders write job outputs
  # there and the API publishes them. Required by the API with apiUrls.
  workspaceClaim: ""
  # Slide inputs are linked from the file named by the RationAI direct-access
  # route. The claim holding the installation's slides, mounted
  # read-only where its CDS mounts it, since model-service links the absolute
  # path CDS answers. The API mounts it; worker files include it too.
  slideVolume:
    existingClaim: ""
    mountPath: ""
  # Extra DNS search domains for pods that call AppService, when the
  # installation hands out short host names from another namespace.
  dnsSearches: []
