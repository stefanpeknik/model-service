groupName: gpu-workers
replicas: 0
minReplicas: 0
maxReplicas: 1
rayStartParams:
  num-cpus: "4"
  num-gpus: "1"
  object-store-memory: "1073741824"
template:
  spec:
{{- with .Values.executionScheduler.empaia.dnsSearches }}
    dnsConfig:
      searches: {{ toJson . }}
{{- end }}
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: ray-worker
        image: "{{ .Values.rayImage.repository }}:{{ .Values.rayImage.tag }}"
        imagePullPolicy: {{ .Values.rayImage.pullPolicy }}
        resources:
          requests:
            cpu: 4
            memory: 18Gi
            nvidia.com/mig-2g.20gb: 1
          limits:
            cpu: 4
            memory: 20Gi
            nvidia.com/mig-2g.20gb: 1
        env:
          {{- include "peknik.proxyEnv" . | nindent 10 }}
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: mlflow-public-credentials
                key: username
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mlflow-public-credentials
                key: token
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: huggingface-secret
                key: token
          # Builders may also be placed here, so storage matches the CPU group.
          - name: TMPDIR
            value: /mnt/scratch
          - name: VIPS_DISC_THRESHOLD
            value: "268435456"
{{- if .Values.executionScheduler.empaia.enabled }}
          - name: EMPAIA_GATEWAY_FACTORY
            value: {{ .Values.executionScheduler.empaia.gatewayFactory | quote }}
          - name: EMPAIA_WORKSPACE_ROOT
            value: {{ .Values.executionScheduler.empaia.workspaceRoot | quote }}
          - name: EMPAIA_SLIDE_ACCESS
            value: {{ .Values.executionScheduler.empaia.slideAccess | default "direct" | quote }}
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsUser: 1000
        volumeMounts:
          - name: shared
            mountPath: /mnt/shared
          - name: scratch
            mountPath: /mnt/scratch
          - name: trt-cache
            mountPath: /mnt/cache
          - name: hf-cache
            mountPath: /mnt/huggingface_cache
    volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-outputs
      - name: scratch
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-scratch
      - name: trt-cache
        persistentVolumeClaim:
          claimName: peknik-persist-model-service-trt-cache
      - name: hf-cache
        persistentVolumeClaim:
          claimName: peknik-persist-model-service-hf-cache
