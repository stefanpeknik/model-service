groupName: cpu-workers
replicas: 0
minReplicas: 0
maxReplicas: 1
rayStartParams:
  num-cpus: "4"
  object-store-memory: "1073741824"
template:
  spec:
{{- include "model-service.empaiaDns" . | nindent 4 }}
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: ray-worker
        image: "{{ .Values.rayImage.repository }}:{{ .Values.rayImage.tag }}"
        imagePullPolicy: {{ .Values.rayImage.pullPolicy }}
        resources:
          requests:
            cpu: 4
            ephemeral-storage: 8Gi
            memory: 8Gi
          limits:
            cpu: 4
            ephemeral-storage: 40Gi
            memory: 10Gi
        env:
          {{- include "peknik.proxyEnv" . | nindent 10 }}
          # Working files (score sums, libvips spills) stay on the node's disk.
          - name: TMPDIR
            value: /mnt/tmp
          - name: VIPS_DISC_THRESHOLD
            value: "268435456"
{{- include "model-service.empaiaEnv" . | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsUser: 1000
        volumeMounts:
          - name: shared
            mountPath: /mnt/shared
          - name: scratch
            mountPath: /mnt/scratch
          - name: tmp
            mountPath: /mnt/tmp
{{- include "model-service.slideVolumeMount" . | nindent 10 }}
    volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-outputs
      - name: scratch
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-full-wsi-scratch
      - name: tmp
        emptyDir:
          sizeLimit: 32Gi
{{- include "model-service.slideVolume" . | nindent 6 }}
