{{- /*
The API's catalog, rendered from the same files as the Serve config. The API
mounts it as a directory and reloads it when kubelet updates the files, so a
catalog change does not restart the API.

- catalog.json: the deployed served models and analyses after the
  environment's patches.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-model-catalog
  namespace: {{ .Release.Namespace }}
data:
  catalog.json: |
    {{- dict "served-models" (include "model-service.servedModels" . | fromJson) "analyses" (include "model-service.analyses" . | fromJson) | toJson | nindent 4 }}
