- name: prov-gigapath
  import_path: model_service.model_implementations.prov_gigapath:app
  route_prefix: /prov-gigapath
  runtime_env:
    config:
      setup_timeout_seconds: 1800
  deployments:
    - name: ProvGigaPath
      max_ongoing_requests: 1024
      max_queued_requests: 8192
      autoscaling_config:
        min_replicas: 0
        max_replicas: 4
        target_ongoing_requests: 256
      ray_actor_options:
        num_cpus: 4
        num_gpus: 1
        memory: 8589934592
        runtime_env:
          env_vars:
            HF_HOME: /mnt/huggingface_cache
      user_config:
        tile_size: 224
        max_batch_size: 512
        batch_wait_timeout_s: 0.1
        model:
          repo_id: prov-gigapath/prov-gigapath
