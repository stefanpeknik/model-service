- name: heatmap-builder
  import_path: model_service.builders.heatmap_builder:app
  route_prefix: /heatmap-builder
  deployments:
    - name: HeatmapBuilder
      max_ongoing_requests: 16
      max_queued_requests: 128
      autoscaling_config:
        min_replicas: 0
        max_replicas: 4
        target_ongoing_requests: 8
      ray_actor_options:
        num_cpus: 8
        memory: 12884901888
      user_config:
        num_threads: 8
        max_concurrent_tasks: 16
