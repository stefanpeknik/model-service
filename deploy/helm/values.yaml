# Cluster-neutral defaults. Every release installs with one environment's
# values on top: `-f environments/<env>/values.yaml`, which sets `environment`,
# the cluster's workers, images, storage and secrets.
#
# Served models come from the repo's catalog/ (the chart's `catalog` symlink):
# every catalog/served-models/<id>.yaml is one Serve application of the
# generic host, with no list to edit. `environment` names the folder
# environments/<env>/ whose served-models/ patches are merged over the base
# files and whose workers/ files `workers` names; `servedModels` deploys all
# files (["*"]) or the IDs listed.
environment: ""
servedModels: ["*"]

# Environment-wide settings every served model gets: `cacheRoot` on a shared
# volume (ONNX Runtime keeps TensorRT engines in <cacheRoot>/<id>/<digest>),
# `env` as each replica's environment variables, and `setupTimeoutSeconds` as
# the limit on setting up each application's runtime_env (empty: Ray's 600).
servedModelSettings:
  cacheRoot: /mnt/cache/trt_cache
  setupTimeoutSeconds: 1800
  env:
    HF_HOME: /mnt/huggingface_cache

# Analyses come from catalog/analyses/ the same way: ["*"] deploys every file,
# named IDs a subset. Each analysis's served models must be deployed too, or
# the render fails naming them. With none, the analysis runner isn't rendered.
analyses: ["*"]

# The one analysis runner (`analysis_runner.serve:app`, route /analyses) that
# executes every deployed analysis: its Ray Serve deployment options, and as
# `userConfig` the threads reading tiles and the tiles in flight per run.
analysisRunner:
  deployment:
    max_ongoing_requests: 1
    max_queued_requests: 4
    backpressure_config:
      status_code: 429
      retry_after_s: 5
    autoscaling_config:
      min_replicas: 0
      max_replicas: 4
      target_ongoing_requests: 1
    ray_actor_options:
      num_cpus: 8
      memory: 12884901888
  userConfig:
    num_threads: 8
    max_concurrent_tasks: 16

# Keeps CPU-only Serve apps off GPU workers. The analysis runner requests
# `perReplica` of this Ray custom resource, and only the CPU worker groups
# advertise it (`perWorker` each, in rayStartParams). Without it, Ray may place
# the runner on a GPU worker's free CPUs, and the served model that needs them
# can't start. perWorker / perReplica caps the CPU-only
# replicas on one worker; keep it above their max_replicas summed (CPUs are
# the real limit).
cpuWorkerResource:
  name: cpu_worker
  perWorker: 100
  perReplica: 1

# Roots callers may name in shared-storage requests (control plane and
# analysis runner); each environment lists its own.
sharedStorageRoots: []

# Worker groups: file names in environments/<environment>/workers/.
workers: []

# The Ray head's image (Dockerfile.ray-cpu), also run by CPU workers that take
# it; GPU workers that take an image setting run `rayGpuImage`
# (Dockerfile.ray-gpu). Both carry the same code.
# Each environment sets both tags; the render fails without them.
rayImage:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
rayGpuImage:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

controlPlane:
  enabled: false
  replicas: 2
  image:
    repository: cerit.io/rationai/model-service-control-plane
    tag: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: ""
    urlKey: database-url
  encryption:
    existingSecret: ""
    keyKey: provider-context-key
  sharedStorage:
    existingClaim: ""
    mountPath: /mnt/data
  rayServeOrigin: ""
  leaseSeconds: 300
  workerPollSeconds: 0.5
  processingAttempts: 3
  providerFinishAttempts: 3
  initialBackoffSeconds: 5
  maximumBackoffSeconds: 300
  defaultDeadlineSeconds: 21600
  maximumDeadlineSeconds: 86400
  perModelLimit: 1
  maxConcurrentExecutions: 4
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

# EMPAIA is on when apiUrls lists an AppService. Empty (the default) refuses
# every EMPAIA job and leaves out all EMPAIA env, volumes, DNS settings and
# marketplace registration; the rest of this block is then ignored.
empaia:
  # AppService URLs that may receive EMPAIA job credentials.
  apiUrls: []
  workspaceRoot: /mnt/model-service-executions
  # Shared by the control plane and the analysis runner: the runner writes job outputs
  # there and the control plane publishes them. Required by the control plane with apiUrls.
  workspaceClaim: ""
  # Slide inputs are linked from the file named by the RationAI direct-access
  # route. The claim holding the installation's slides, mounted
  # read-only where its CDS mounts it, since model-service links the absolute
  # path CDS answers. The control plane mounts it; worker files include it too.
  slideVolume:
    existingClaim: ""
    mountPath: ""
  # Extra DNS search domains for pods that call AppService, when the
  # installation hands out short host names from another namespace.
  dnsSearches: []
  # The control plane registers an app, with its modes, for every deployed analysis with
  # `expose.empaia`, at startup, in this marketplace (the marketplace mock that
  # EMPAIA test installations run), and deletes the apps it registered there
  # that no deployed analysis has any more. Empty url: no registration.
  marketplace:
    url: ""
    organizationId: ""
    # model-service's name in the installation's JES_HTTP_TARGETS. Unique per
    # installation: it also marks the apps and preprocessing triggers this
    # deployment owns.
    jesTarget: model-service
    # The installation's Medical Data Service: the control plane keeps the preprocessing
    # triggers the analyses list there, with these client credentials.
    # Empty: triggers are left alone.
    mdsUrl: ""
    # Client credentials for the marketplace, from a Secret; empty idpUrl: none.
    idpUrl: ""
    clientId: ""
    existingSecret: ""
    clientSecretKey: client-secret
