{
  "identifier": "prostate-heatmap",
  "inputs": {
    "slide": {
      "kinds": [
        "shared_path",
        "provider"
      ],
      "media_type": "application/vnd.openmicroscopy",
      "empaia": {
        "type": "wsi"
      }
    },
    "region_of_interest": {
      "kinds": [
        "shared_path",
        "provider"
      ],
      "media_type": "image/tiff",
      "empaia": {
        "type": "rectangle",
        "reference": "slide",
        "classes": [
          "org.empaia.global.v1.classes.roi"
        ]
      }
    }
  },
  "outputs": {
    "heatmap": {
      "kind": "shared_artifact",
      "media_type": "image/tiff",
      "empaia": {
        "type": "continuous_pixelmap",
        "reference": "slide"
      }
    }
  },
  "configuration_defaults": {
    "empaia": {
      "output_path": "heatmap.tiff",
      "stride_fraction": 0.5,
      "output_tile_height": 256,
      "output_tile_width": 256
    }
  },
  "empaia": {
    "name": "Prostate Classifier",
    "name_short": "ProstCls",
    "namespace": "org.empaia.rationai.prostate_cls.v3.0",
    "description": "Classifies prostate tissue and produces a heatmap",
    "mode": "standalone",
    "permissions": {
      "data_transmission_to_external_service_provider": true
    }
  }
}
